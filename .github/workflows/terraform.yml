name: 'Terraform'

on:
  push:
    branches: main
    paths: pipeline/**
  pull_request:
    branches: main
    paths: pipeline/**
    
permissions:
  contents: read  

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    name: 'Terraform Plan'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pipeline

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6
      
    - name: Init TFLint
      run: tflint --init
      env:
        GITHUB_TOKEN: ${{ github.token }}
      
    - name: Run TFLint
      id: tflint
      shell: bash
      run: tflint -f compact --minimum-failure-severity=error | tee tflint.txt
      continue-on-error: true

    - name: Comment TFLint report on PR
      uses: actions/github-script@v9
      with:
        script: |
          const out = require('fs').readFileSync('pipeline/tflint.txt', 'utf8') || 'No issues found';
          const body = `#### \`[${{ steps.tflint.outcome }}]\` TFLint
          <details><summary>Show results</summary>

          \`\`\`
          ${out}
          \`\`\`
          </details>`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          })

    - name: Checkov Scan
      uses: bridgecrewio/checkov-action@master
      id: checkov
      with:
        directory: ./pipeline
        quiet: true
        soft_fail: true
        output_format: cli
        output_file_path: checkov
        framework: terraform

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-region: ${{ vars.AWS_REGION }}
        role-to-assume: ${{ secrets.ARN_ROLE_READ_ONLY }}
        role-session-name: gha-pipeline-aws-${{ github.run_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: v1.16.0

    - name: Terraform Init
      run: terraform init ${{ vars.INIT_PARAMETERS }}

    - name: Terraform Format
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Validate
      run: terraform validate
     
    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false
    
    - name: Comment plan on PR
      uses: actions/github-script@v9      
      with:
        script: |
          const body = `#### \`[${{ steps.plan.outcome }}]\` Terraform Plan
          <details><summary>Show plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

    - name: Comment Checkov report on PR
      uses: actions/github-script@v9
      with:
        script: |
         const out = require('fs').readFileSync('checkov/results_cli.txt', 'utf8');
          const body = `#### \`[${{ steps.checkov.outcome }}]\` Checkov Scan
          <details><summary>Show results</summary>

          \`\`\`
          ${out}
          \`\`\`
          </details>`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          })

    - name: Fail on TFLint error
      if: steps.tflint.outcome == 'failure'
      run: exit 1

  apply:
    
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write
           
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.ARN_ROLE }}
          role-session-name: gha-pipeline-aws-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.16.0

      - name: Terraform Init
        run: terraform init ${{ vars.INIT_PARAMETERS }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
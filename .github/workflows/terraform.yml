name: 'Terraform'

on:
  push:
    branches: main
    paths: remediations/**
  pull_request:
    branches: main
    paths: remediations/**
    
permissions:
      id-token: write
      contents: read
      pull-requests: write  

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: 'Terraform-Pipeline'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./remediations

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.ARN_ROLE }}
        role-session-name: gha-pipeline-aws-${{ github.run_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform Init
      run: terraform init -backend-config="secure-pipeline-aws-state" -backend-config="key=state/terraform.tfstate" -backend-config="region=us-east-1"

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/"main"' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
